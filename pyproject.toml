# SPDX-License-Identifier: BSD-3-Clause

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-lost-update-env"
version = "0.1.0"
description = "OpenEnv environment: update a shared JSON document while a scripted rival writes to it"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Eugenio \"Jay\" Zuccarelli" }]
requires-python = ">=3.10"
dependencies = [
    "openenv>=0.10.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
llm = [
    "openai>=1.0.0",
]

[project.scripts]
server = "lost_update_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["lost_update_env", "lost_update_env.server"]
package-dir = { "lost_update_env" = ".", "lost_update_env.server" = "server" }

[tool.pytest.ini_options]
testpaths = ["tests"]
